[package]
name = "ghostty-wall"
version = "1.0.3"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "0.8"
toml_edit = "0.22"
ureq = "3.4.2"
