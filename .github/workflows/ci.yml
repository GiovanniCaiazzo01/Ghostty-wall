name: CI

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            git ls-files -z > "$RUNNER_TEMP/changed-files"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          fi
          runtime=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|docs/*|website/*) ;;
              *) runtime=true; break ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
  rust:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: cargo test --locked --all-targets --all-features
      - name: Test CLI and full-screen TUI in PTYs
        run: |
          cargo build --locked --release
          GHOSTTY_WALL_BIN="$PWD/target/release/ghostty-wall" python3 -B -m unittest discover -s tests -p '*pty.py' -v
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify generated documentation
        run: |
          python3 website/generate.py
          python3 website/test_site.py
          git diff --exit-code -- website/dist
  bash-v0-regression:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Bash v0 regression tests
        run: bash scripts/test.sh
      - name: Test release installer
        run: bash scripts/test-install-release.sh
  shellcheck:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck -x bin/ghostty-wall scripts/install.sh scripts/install-release.sh scripts/test.sh scripts/test-install-release.sh scripts/integration-test.sh
