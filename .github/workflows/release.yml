name: Release

on:
  push:
    tags:
      - "v1.*"

permissions:
  contents: write

jobs:
  linux-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify release gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          bash scripts/test.sh
      - name: Build locked release binary
        run: cargo build --locked --release
      - name: Package Linux artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          name="ghostty-wall-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          install -m 0755 target/release/ghostty-wall "$name/ghostty-wall"
          install -m 0755 scripts/install-v1.sh "$name/install-v1.sh"
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          name="ghostty-wall-${VERSION}-x86_64-unknown-linux-gnu"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --verify-tag --generate-notes --title "Ghostty Wall $VERSION"
          gh release upload "$VERSION" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
